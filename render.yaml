# Optional named host: https://xscanner.onrender.com (Render free web service; needs a Render account + a GitHub repo).
services:
  - type: web
    name: xscanner            # becomes xscanner.onrender.com if the name is free
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: false         # deploys are manual (push-snapshot.sh then trigger_deploy); data commits carry [skip render]
    envVars:
      - key: PUBLIC_READONLY
        value: "1"            # no Run scan; CA lookup + charts stay free for anyone
      - key: SCANNER_DIR
        value: deploy/data    # snapshot of report.json + dashboard_data.json
      - key: LEDGER_PATH
        value: deploy/data/ledger.json
      - key: LIVE_SCAN
        value: "1"            # server-side scan loop every LIVE_SCAN_INTERVAL s (default 120); snapshot until first scan
      # Optional, set in the Render dashboard only (never in this repo): X_BEARER_TOKEN enables the live X feed.

      # Accounts (fix9): username/email + password, hashed with argon2id. Set in the Render dashboard only, never here:
      #   DATABASE_URL   internal connection string of the Render Postgres (durable accounts + synced lists); without it accounts use a temporary SQLite file
      #   SESSION_SECRET random 32+ chars; signs the HttpOnly session cookie and enables local accounts
      #   SIGNUP_MODE    open (default) | invite | closed ; INVITE_CODES=comma,separated (for invite mode)
      #   RL_* limits (optional): RL_LOGIN_IP, RL_LOGIN_IP_FAIL, RL_LOGIN_ACCT_FAIL, RL_SIGNUP_IP, RL_SIGNUP_ALL, RL_SYNC_USER
      # Optional Google sign-in (code kept, OFF unless these are set) — set these in the Render dashboard only, never in this repo:
      #   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, SESSION_SECRET
      #   AUTH_REQUIRED=false (default; true requires a signed-in session)
      #   ALLOWED_EMAILS=comma-separated allow-list (optional)
      # Authorized redirect URI in Google Cloud Console:
      #   https://xscanner-c8jo.onrender.com/auth/callback
