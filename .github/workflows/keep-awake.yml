# Keeps the free Render instance (and its live scan loop) awake: Render sleeps after ~15 min idle.
# Read-only GET of the public health endpoint; no secrets used.
name: keep-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keep-awake
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health (covers ~30-60 s cold starts)
        run: |
          set -u
          URL="https://xscanner-c8jo.onrender.com/api/health"
          for i in 1 2 3 4; do
            code=$(curl -sS -o body.json -w '%{http_code}' --max-time 90 "$URL" || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              head -c 400 body.json; echo
              exit 0
            fi
            sleep 15
          done
          echo "health check failed after 4 attempts"
          exit 1
